<!doctype html><meta charset="utf-8"><title>audit</title>
<style>
body{margin:0;background:#fff;font:12px/1.3 sans-serif;direction:ltr}
.ex{border-top:2px solid #999;padding:4px 6px}
.ex h2{font-size:14px;margin:0 0 2px;direction:rtl;text-align:left}
.ex .txt{direction:rtl;font-size:11px;color:#333;max-width:1500px;white-space:pre-wrap}
.r{display:flex;gap:3px;flex-wrap:wrap}
.f{width:254px;background:#dcd8d2;position:relative}
body.big .f{width:398px}
.f svg{width:100%;height:auto;display:block}
.f .cap{position:absolute;left:2px;top:2px;background:rgba(255,255,255,.85);padding:1px 4px;font-size:11px;direction:rtl}
.f.key{outline:3px solid #d33}
</style>
<div id="g"></div>
<script src="../shared/data.js"></script>
<script src="../shared/doll.js"></script>
<script>
var q = new URLSearchParams(location.search), L = +(q.get('l') || 1), only = q.get('ex'), full = q.get('full');
if (q.get('big')) document.body.className = 'big';
var Ls = window.HT_DATA.lessons.filter(function (x) { return x.n === L; });
var NS = 'http://www.w3.org/2000/svg', G = 205;
Ls.forEach(function (lesson) {
  lesson.exercises.forEach(function (E) {
    if (only && only.split(',').indexOf(String(E.i)) < 0) return;
    var d = document.createElement('div'); d.className = 'ex';
    var hdr = document.createElement('h2'); hdr.textContent = E.id + ' ' + E.name + ' | ' + E.dose + (E.sides ? ' | sides' : '') + (E.hold ? ' | hold' : '') + ' | poses=' + E.scene.poses.length + ' steps=' + E.steps.length;
    d.appendChild(hdr);
    if (full) { var t = document.createElement('div'); t.className = 'txt'; t.textContent = 'התחלה: ' + E.start + '\n' + E.steps.map(function (s, i) { return (i + 1) + '. ' + s; }).join('\n') + '\nדגשים: ' + E.focus.join(' | ') + '\nלהימנע: ' + E.avoid.join(' | ') + '\nנשימה: ' + E.breath; d.appendChild(t); }
    var row = document.createElement('div'); row.className = 'r'; d.appendChild(row);
    var frames = [];
    var n = E.scene.poses.length;
    if (E.hold) { frames = [[0, 'hold 0'], [0.5, 'hold .5'], [1, 'hold 1']]; }
    else {
      // key poses plus a midpoint between each pair (including the return to the start)
      var totalW = E.scene.poses.reduce(function (s, p) { return s + (p.w || 1); }, 0), acc = 0;
      for (var i = 0; i < n; i++) { var w = E.scene.poses[i].w || 1; frames.push([acc / totalW, 'P' + i, true]); frames.push([(acc + w / 2) / totalW, 'P' + i + '→' + ((i + 1) % n)]); acc += w; }
    }
    frames.forEach(function (fr) {
      var f = document.createElement('div'); f.className = 'f' + (fr[2] ? ' key' : '');
      var svg = document.createElementNS(NS, 'svg'); f.appendChild(svg);
      var fig = HTDoll.create(svg, E.scene);
      var r = E.hold ? fig.atHold(fr[0], 0) : fig.atPhase(fr[0]);
      fig.draw(r.pose);
      // floor line + bed/chair reference line
      var ln = document.createElementNS(NS, 'line'); ln.setAttribute('x1', 0); ln.setAttribute('x2', 400); ln.setAttribute('y1', G); ln.setAttribute('y2', G); ln.setAttribute('stroke', '#c00'); ln.setAttribute('stroke-width', 0.6); ln.setAttribute('stroke-dasharray', '3 3'); svg.appendChild(ln);
      var c = document.createElement('div'); c.className = 'cap'; c.textContent = fr[1] + ' ' + (r.cap || '') + (r.br ? ' [' + (r.br === 'in' ? 'שאיפה' : 'נשיפה') + ']' : '');
      f.appendChild(c); row.appendChild(f);
    });
    document.getElementById('g').appendChild(d);
  });
});
</script>
